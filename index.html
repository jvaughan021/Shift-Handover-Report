<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Support Shift Handover Helper</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen p-4 flex justify-center items-start">

    <div class="w-full max-w-md bg-slate-800 rounded-xl shadow-2xl border border-slate-700 p-5 space-y-4">
        
        <!-- Header -->
        <div class="text-center border-b border-slate-700 pb-3">
            <h1 class="text-xl font-bold text-sky-400">⚡ Shift Handover Builder</h1>
            <p class="text-xs text-slate-400 mt-1">Quick, local formatting for support reports & logs</p>
        </div>

        <!-- Form Fields -->
        <div class="space-y-3">
            <div>
                <label for="shiftType" class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-1">Shift Type</label>
                <select id="shiftType" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-sm text-slate-200 focus:ring-2 focus:ring-sky-500 focus:outline-none">
                    <option value="Day Shift">Day Shift</option>
                    <option value="Late Shift">Late Shift</option>
                    <option value="Night Shift">Night Shift</option>
                    <option value="24-Hour Shift (Day + Sleep-in)">24-Hour Shift (Day + Sleep-in)</option>
                    <option value="Incident Log">Incident Log</option>
                </select>
            </div>

            <div>
                <label for="staffName" class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-1">Staff Member(s)</label>
                <input type="text" id="staffName" placeholder="e.g. Alex / Sam" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-sm text-slate-200 focus:ring-2 focus:ring-sky-500 focus:outline-none">
            </div>

            <!-- Routine Checks -->
            <div>
                <label class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-1">Routine Checks</label>
                <div class="grid grid-cols-2 gap-2 text-xs">
                    <label class="flex items-center space-x-2 bg-slate-900 p-2 rounded-lg border border-slate-700 cursor-pointer">
                        <input type="checkbox" id="chkFire" class="rounded bg-slate-800 border-slate-600 text-sky-500 focus:ring-sky-500">
                        <span class="text-slate-300">Fire Exits Clear</span>
                    </label>
                    <label class="flex items-center space-x-2 bg-slate-900 p-2 rounded-lg border border-slate-700 cursor-pointer">
                        <input type="checkbox" id="chkMeds" class="rounded bg-slate-800 border-slate-600 text-sky-500 focus:ring-sky-500">
                        <span class="text-slate-300">Meds Logged</span>
                    </label>
                    <label class="flex items-center space-x-2 bg-slate-900 p-2 rounded-lg border border-slate-700 cursor-pointer">
                        <input type="checkbox" id="chkKeys" class="rounded bg-slate-800 border-slate-600 text-sky-500 focus:ring-sky-500">
                        <span class="text-slate-300">Keys Accounted</span>
                    </label>
                    <label class="flex items-center space-x-2 bg-slate-900 p-2 rounded-lg border border-slate-700 cursor-pointer">
                        <input type="checkbox" id="chkRounds" class="rounded bg-slate-800 border-slate-600 text-sky-500 focus:ring-sky-500">
                        <span class="text-slate-300">Rounds Done</span>
                    </label>
                </div>
            </div>

            <div>
                <label for="handoverNotes" class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-1">Key Updates & Handover Notes</label>
                <textarea id="handoverNotes" rows="4" placeholder="Enter notes, tenant updates, or maintenance items..." class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-sm text-slate-200 focus:ring-2 focus:ring-sky-500 focus:outline-none"></textarea>
            </div>

            <!-- Action Buttons -->
            <div class="pt-2 space-y-2">
                <button onclick="copyNote()" class="w-full bg-sky-600 hover:bg-sky-500 active:bg-sky-700 text-white font-bold py-3 px-4 rounded-lg shadow-lg transition duration-200 flex items-center justify-center space-x-2">
                    <span>📋</span>
                    <span>Copy Formatted Note</span>
                </button>
                
                <button onclick="clearFields()" class="w-full bg-slate-700 hover:bg-slate-600 active:bg-slate-800 text-slate-300 font-medium py-2 px-4 rounded-lg transition duration-200 text-sm">
                    🗑️ Clear Form
                </button>
            </div>
        </div>

        <!-- A-Ads Banner Container -->
        <div class="mt-4 pt-4 border-t border-slate-700/60">
            <div class="text-[10px] text-slate-500 font-semibold tracking-wider text-center mb-2 uppercase">Sponsored Advertisement</div>
            
            <!-- BEGIN AADS AD UNIT 2458977 -->
            <div id="frame" style="width: 100%; margin: auto; position: relative; z-index: 99998;">
                <iframe data-aa='2458977' src='https://acceptable.a-ads.com/2458977/?size=Adaptive'
                        style='border:0; padding:0; width:100%; height:auto; overflow:hidden; display: block; margin: auto'></iframe>
                <div style="width: 100%; margin:auto; position: absolute; left: 0; right: 0;">
                    <a target="_blank" style="display:inline-block; font-size: 11px; color: #94a3b8; padding: 4px 10px; background: #1e293b; text-decoration: none; border-radius: 0 0 4px 4px;" id="frame-link" href="https://aads.com/campaigns/new/?source_id=2458977&source_type=ad_unit&partner=2458977">Advertise here</a>
                </div>
            </div>
            <!-- END AADS AD UNIT 2458977 -->
        </div>

        <!-- Privacy & Attribution Footer -->
        <div class="text-center pt-2 text-xs text-slate-400 space-y-1">
            <p>🔒 100% Client-side tool: No data is saved or transmitted.</p>
            <p class="font-medium text-slate-300">Created by Jack Vaughan</p>
        </div>

    </div>

    <!-- Notification Toast -->
    <div id="toast" class="fixed bottom-5 left-1/2 -translate-x-1/2 bg-emerald-600 text-white text-sm font-semibold px-4 py-2.5 rounded-full shadow-2xl opacity-0 transition-opacity duration-300 pointer-events-none">
        Copied to clipboard!
    </div>

    <script>
        function copyNote() {
            const shift = document.getElementById('shiftType').value;
            const staff = document.getElementById('staffName').value.trim() || 'N/A';
            const notes = document.getElementById('handoverNotes').value.trim() || 'No specific updates recorded.';
            const date = new Date().toLocaleDateString('en-GB');

            // Collect Routine Checks
            const checks = [];
            if (document.getElementById('chkFire').checked) checks.push('[X] Fire Exits Clear');
            if (document.getElementById('chkMeds').checked) checks.push('[X] Medication Audit Completed');
            if (document.getElementById('chkKeys').checked) checks.push('[X] Keys & Fobs Accounted For');
            if (document.getElementById('chkRounds').checked) checks.push('[X] Welfare Rounds Conducted');

            const checksFormatted = checks.length > 0 ? checks.join('\n') : '[ ] No routine checks selected';

            const formattedText = `=== SHIFT HANDOVER REPORT ===\nDate: ${date}\nShift: ${shift}\nStaff: ${staff}\n\nROUTINE CHECKS:\n${checksFormatted}\n\nNOTES & UPDATES:\n${notes}\n===========================`;

            navigator.clipboard.writeText(formattedText).then(() => {
                showToast();
            }).catch(err => {
                alert('Error copying text: ' + err);
            });
        }

        function clearFields() {
            document.getElementById('staffName').value = '';
            document.getElementById('handoverNotes').value = '';
            document.getElementById('chkFire').checked = false;
            document.getElementById('chkMeds').checked = false;
            document.getElementById('chkKeys').checked = false;
            document.getElementById('chkRounds').checked = false;
        }

        function showToast() {
            const toast = document.getElementById('toast');
            toast.classList.remove('opacity-0');
            toast.classList.add('opacity-100');
            setTimeout(() => {
                toast.classList.remove('opacity-100');
                toast.classList.add('opacity-0');
            }, 2000);
        }
    </script>
</body>
</html>
